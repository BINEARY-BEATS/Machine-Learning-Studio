[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-studio"
version = "2.0.0"
description = "Production desktop ML platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.5.0",
    "shap>=0.44.0",
    "pyqtgraph>=0.13.0",
    "fsspec>=2024.2.0",
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
    "chardet>=5.2.0",
    "imbalanced-learn>=0.12.0",
]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "pytest-qt>=4.3.0"]

[project.scripts]
ml-studio = "ml_studio.main:main"

[tool.pytest.ini_options]
testpaths = ["ml_studio/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ml_studio/core"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_studio*"]
